name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install client dependencies
        run: devenv shell -- bash -c 'cd client && npm ci'

      - name: Build client
        run: devenv shell -- bash -c 'cd client && npm run build'

      - name: Repository checks
        run: devenv shell -- durable-test

      - name: Build Storybook
        run: devenv shell -- bash -c 'cd client && npm run build-storybook'

      - name: Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: devenv shell -- bash -c 'cd client && npx chromatic --storybook-build-dir=storybook-static'
