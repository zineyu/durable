name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Install client dependencies
        run: devenv shell -- bash -c 'cd client && npm ci'

      - name: Build client
        run: devenv shell -- bash -c 'cd client && npm run build'

      - name: Repository checks
        run: devenv shell -- durable-test

      - name: Install Playwright browser
        run: devenv shell -- bash -c 'cd client && npx playwright install --with-deps chromium'

      - name: End-to-end tests
        run: devenv shell -- durable-e2e

      - name: Build Storybook
        run: devenv shell -- bash -c 'cd client && npm run build-storybook'

      - name: Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: devenv shell -- bash -c 'cd client && npx chromatic --storybook-build-dir=storybook-static'
