name: OpenCodeReview

# 密钥（Secrets）
#   OCR_LLM_AUTH_TOKEN  OpenCode Go 订阅的 API key
# 变量（Variables，均可省略，省略时用下面的默认值）
#   OCR_LLM_URL        默认 OpenCode Go 的 OpenAI 兼容端点
#   OCR_LLM_MODEL      默认 deepseek-v4.1-flash
#   OCR_LLM_PROTOCOL   默认 openai
# GITHUB_TOKEN 由 Actions 注入。项目规则见 .opencodereview/rule.json。
# OpenCode Go 强制要求 x-opencode-session 头，缺失返回 400 MissingSessionID。

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@v1.13.2
        with:
          ocr_version: 1.13.2
          llm_url: ${{ vars.OCR_LLM_URL || 'https://opencode.ai/inference/go/openai/v1/chat/completions' }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL || 'deepseek-v4.1-flash' }}
          llm_protocol: ${{ vars.OCR_LLM_PROTOCOL || 'openai' }}
          llm_use_anthropic: ${{ (vars.OCR_LLM_PROTOCOL || 'openai') == 'anthropic' }}
          llm_extra_headers: x-opencode-session=durable-ocr-ci
          language: Chinese
          background: ${{ steps.pr-context.outputs.title || github.event.pull_request.title }}
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          checkpoint_range: 'true'
          incremental: 'true'
          route_categories: style,documentation
          stream_progress: 'true'
