[package]
name = "ui"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["stream"] }
rust-embed = { version = "8.13.0", features = ["debug-embed", "interpolate-folder-path"] }
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
agent = { path = "../agent" }
reqwest = { version = "0.13.5", features = ["json"] }
