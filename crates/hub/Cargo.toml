[package]
name = "hub"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
durable = { path = "../core" }
mime_guess = "2.0.5"
rust-embed = { version = "8.13.0", features = ["debug-embed", "interpolate-folder-path"] }
serde = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
agent = { path = "../agent" }
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = { workspace = true }
tempfile = "3.27.0"
